version: "1.0"
name: colonial-pipeline
description: |
  Colonial Pipeline-style enterprise ransomware scenario with compromised VPN access,
  credential theft, PsExec lateral movement, staged collection, dual-channel exfiltration,
  shadow-copy deletion, and dual file-server encryption. Designed for SOC-bench truth
  projection and partial sensor visibility (DP4).

environment:
  description: |
    Mid-size energy pipeline operator with remote-access VPN, corporate IT workstations,
    Windows server estate (AD, mail, dual file servers, staging FTP), and a lightly
    segmented OT HMI network. Sensor placement intentionally leaves gaps for realistic
    collection blind spots.
  domain: "colonial-energy.local"

  timezone:
    default: "America/New_York"

