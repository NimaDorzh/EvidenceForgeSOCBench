    - hostname: WKS-OPS-02
      ip: "10.60.20.22"
      os: "Windows 10 Enterprise"
      type: workstation
      assigned_user: l.ortiz
      services: ["dns-client"]

    - hostname: DC-01
      ip: "10.60.30.10"
      os: "Windows Server 2022"
      type: domain_controller
      services: ["kerberos", "ldap", "dns"]
      roles: ["domain_controller", "dns_server"]

    - hostname: MAIL-01
      ip: "10.60.30.20"
      os: "Windows Server 2019"
      type: server
      services: ["exchange", "dns-client"]
      roles: ["mail_server"]

    - hostname: FS-01
      ip: "10.60.30.30"
      os: "Windows Server 2019"
      type: server
      services: ["smb", "dfs", "dns-client"]
      roles: ["file_server"]

    - hostname: FS-02
      ip: "10.60.30.31"
      os: "Windows Server 2019"
      type: server
      services: ["smb", "dfs", "dns-client"]
      roles: ["file_server"]

    - hostname: FTP-01
      ip: "10.60.30.40"
      os: "Ubuntu 22.04 LTS"
      type: server
      services: ["vsftpd", "ssh", "dns-client"]

    - hostname: OT-HMI-01
      ip: "10.60.40.10"
      os: "Windows 10 IoT Enterprise LTSC"
      type: workstation
      assigned_user: p.brown
      services: ["dns-client"]

  network:
    public_cidrs:
      - "198.18.50.0/24"

    segments:
      - name: remote_access
        cidr: "10.60.10.0/24"
        description: "VPN concentrator and remote-access edge"
        exposure: both
        external_ratio: 0.6
        systems: [VPN-GW-01]

      - name: corporate_it
        cidr: "10.60.20.0/24"
        description: "Corporate workstations and operations endpoints"
        exposure: internal
        systems:
          [WKS-01, WKS-02, WKS-03, WKS-04, WKS-05, WKS-06, WKS-OPS-01, WKS-OPS-02]

      - name: server
        cidr: "10.60.30.0/24"
        description: "Core Windows and Linux server estate"
        exposure: internal
        systems: [DC-01, MAIL-01, FS-01, FS-02, FTP-01]

      - name: OT
        cidr: "10.60.40.0/24"
        description: "OT HMI segment with incomplete isolation from IT servers"
        exposure: internal
        systems: [OT-HMI-01]

    sensors:
      - type: network
        name: corp-core-span
        hostname: ZEEK-CORP-SPAN
        monitoring_segments: [corporate_it]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
        description: "Core SPAN on corporate IT VLAN — east-west workstation traffic only"

      - type: network
        name: perimeter-tap
        hostname: ZEEK-PERIM-TAP
        monitoring_segments: [remote_access, server]
        direction: bidirectional
        placement: tap
        log_formats: [zeek]
        description: "Perimeter TAP for VPN ingress and north-south server traffic"

      - type: ids
        name: perimeter-ids
        hostname: IDS-PERIM-01
        monitoring_segments: [remote_access, server]
        direction: inbound
        placement: tap
        log_formats: [snort_alert]
        description: "Perimeter IDS on inbound VPN and server-facing traffic"

      - type: firewall
        name: perimeter-fw
        hostname: ASA-PERIM-01
        monitoring_segments: [remote_access, corporate_it, server, OT]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
        interfaces:
          remote_access: outside
          corporate_it: inside
          server: dmz
          OT: ot
        default_action: deny
        deny_ratio: 1.8
        threat_detection_rate: 12
        nat_rules:
          - type: dynamic_pat
            src: [corporate_it, server]
            mapped_ip: "198.18.50.1"
        policy:
          - {src: external, dst: remote_access, ports: [1194, 443, 22], action: permit}
          - {src: remote_access, dst: corporate_it, ports: [3389, 445, 5985], action: permit}
          - {src: corporate_it, dst: server, ports: [53, 88, 389, 445, 636, 3268], action: permit}
          - {src: server, dst: server, ports: [53, 88, 389, 445, 21, 22], action: permit}
          - {src: server, dst: OT, ports: [445, 3389, 135], action: permit}
          - {src: corporate_it, dst: external, ports: [80, 443, 53], action: permit}
          - {src: server, dst: external, ports: [21, 443, 53], action: permit}
          - {src: OT, dst: server, ports: [445, 3389], action: permit}

